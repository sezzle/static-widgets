include:
  - project: "DevOps/templates"
    ref: "v2.0.4"
    file:
      - ".compile/js.yml"
      - ".build/npm.yml"
      - ".deploy/npm.yml"
      - ".deploy/cloudfront.yml"

image: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:24"

variables:
  JIRA_PROJECT_NAME: "MERCHANT"
  NPM_NEWVERSION: "4.0.0"
  s3_bucket_production: "checkout-sdk.sezzle.com"
  s3_bucket_staging: "staging.checkout-sdk.sezzle.com"
  cf_dist_production: "E2HSGLI0811JNF"
  cf_dist_staging: "E2VP0QA9ZBJOEA"

# NPM_CONFIG_REGISTRY is set as a project/group CI/CD variable pointing at
# Verdaccio. Verdaccio doesn't proxy public packages, so `bun install`
# (which routes both metadata and tarballs through the configured registry)
# 404s on public deps. `npm ci` is unaffected because package-lock.json
# resolves tarballs directly from registry.npmjs.org. Override per-job here
# until DevOps scopes the registry properly via .npmrc instead of an env var.
.bun_registry_override:
  before_script:
    - export NPM_CONFIG_REGISTRY="https://registry.npmjs.org/"
    - !reference [default, before_script]

compile_js:npm_install:
  before_script: !reference [.bun_registry_override, before_script]

build_npm:branch:
  before_script: !reference [.bun_registry_override, before_script]

build_npm:preview:
  before_script: !reference [.bun_registry_override, before_script]

build_npm:staging:
  before_script: !reference [.bun_registry_override, before_script]

build_npm:sandbox:
  before_script: !reference [.bun_registry_override, before_script]

build_npm:production:
  before_script: !reference [.bun_registry_override, before_script]

deploy_cloudfront:affirm_modals:
  extends:
    - .deploy_cloudfront
  environment: "affirm_modals/${env_production}"
  tags:
    - ${tag_deploy_us}
  variables:
    S3_BUCKET: "sezzlemedia/affirm"
    CF_DIST: "EFV0KW59BE883"
  script:
    - |
      log section "Copy static files to ./build"
      mkdir -p ./build/modal
      cp -v ./competitor-modals/affirm/modal/*.html ./build/modal
      log section-end
    - |
      aws_cloudfront_deploy --dryrun
      aws_cloudfront_deploy
  rules:
    - !reference [.deploy_default_rules]
    - !reference [.deploy_production_rules]

